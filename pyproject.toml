[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twinrl_onco"
version = "0.1.0"
description = "World-model-empowered digital twin with hierarchical RL for venetoclax resistance-trajectory simulation in CLL"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "msgspec>=0.18",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["ruff", "black", "isort", "mypy", "pytest", "pre-commit"]

[project.scripts]
twinrl = "twinrl_onco.panel.console:cli"

[tool.setuptools.packages.find]
include = ["twinrl_onco*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["twinrl_onco"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["twinrl_onco"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
ignore_missing_imports = true
files = ["twinrl_onco"]

[tool.pytest.ini_options]
testpaths = ["checkrides"]
addopts = "-q"
